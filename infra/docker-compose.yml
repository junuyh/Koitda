# 코잇다 로컬 개발 인프라
# - PostgreSQL 18 : 애플리케이션 DB (Flyway 마이그레이션으로 스키마 재현)
# - MinIO         : S3 호환 객체 저장소 (이미지·PDF 실체 저장, DB에는 키/메타데이터만)
#
# 실행:  cd infra && cp .env.example .env && docker compose up -d
# 종료:  docker compose down        (데이터 유지)
#        docker compose down -v     (볼륨까지 삭제, 초기화)

name: koitda

services:
  postgres:
    image: postgres:18
    container_name: koitda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-koitda}
      POSTGRES_USER: ${POSTGRES_USER:-koitda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-koitda_local_pw}
      # UTC 저장 원칙(ERD 공통설계 4)을 컨테이너 레벨에서도 고정
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 이미지는 마운트 지점이 /var/lib/postgresql (하위에 버전 디렉터리)로 바뀌었다.
      # 과거 관례인 /var/lib/postgresql/data 로 마운트하면 컨테이너가 재시작을 반복한다.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # 백엔드가 마이그레이션을 돌리기 전 DB가 준비됐는지 확인
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-koitda} -d ${POSTGRES_DB:-koitda}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: koitda-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-koitda}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-koitda_local_pw}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"       # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # 웹 콘솔 (http://localhost:9001)
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
