spring.application.name=koitda

# --- DataSource (로컬 기본값 = infra/docker-compose 의 값. 운영 비밀값은 환경변수로 주입) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/koitda}
spring.datasource.username=${DB_USERNAME:koitda}
spring.datasource.password=${DB_PASSWORD:koitda_local_pw}

# --- JPA ---
# 스키마의 진실은 Flyway SQL 이다. Hibernate 가 테이블을 만들거나 바꾸지 못하게 막는다.
spring.jpa.hibernate.ddl-auto=none
# 실제 스키마와 엔티티 매핑이 어긋나면 기동 시 실패시켜 조기에 잡는다.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway : 클래스패스의 V*.sql 을 순서대로 적용 ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- 파일 저장 ---
# 로컬 파일시스템 구현(StorageService 추상화). 운영은 S3/MinIO 구현으로 교체.
# DB(file_asset)에는 메타데이터와 storage_key 만 저장하고, 실체는 아래 경로에 둔다.
koitda.storage.dir=${STORAGE_DIR:storage-data}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=120MB

# --- Jackson ---
# Jackson 3 는 요청 JSON 에서 빠진 primitive(boolean 등)를 오류 처리한다.
# 생략된 값은 기본값(false/0)으로 관대하게 처리하도록 되돌린다(생략=미동의/미확인 의미와도 일치).
spring.jackson.deserialization.fail-on-null-for-primitives=false

# --- 카카오 소셜 로그인 ---
# 키는 저장소에 커밋하지 않는다. 카카오 개발자센터에서 앱을 만들고 환경변수로 주입한다.
#   KAKAO_CLIENT_ID     : REST API 키
#   KAKAO_CLIENT_SECRET : (선택) 보안 강화 시 사용
#   KAKAO_REDIRECT_URI  : 카카오 앱에 등록한 Redirect URI(프론트 콜백 경로와 동일)
# 미설정 시 카카오 로그인 버튼은 자동으로 숨겨진다(/auth/kakao/available=false).
kakao.client-id=${KAKAO_CLIENT_ID:}
kakao.client-secret=${KAKAO_CLIENT_SECRET:}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:3000/auth/kakao/callback}

# --- AI 게이지 조언(Google Gemini) ---
# 키는 저장소에 커밋하지 않는다. Google AI Studio 에서 발급받아 환경변수로 주입한다.
#   GEMINI_API_KEY : Gemini API 키   (미설정 시 AI 조언 버튼 자동 숨김 → /gauge/ai-available=false)
#   GEMINI_MODEL   : (선택) 모델명. 기본 gemini-flash-latest (구모델은 종료될 수 있음)
# 계산·수치는 코드가 담당하고, AI 는 결과를 바탕으로 '자연어 조언'만 생성한다.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-flash-latest}
